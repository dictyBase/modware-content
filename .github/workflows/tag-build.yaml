# Template for the service-repo tag workflow.
# Rendered by `just ci render-tag-deploy` — deploy-only: the tag is cut from
# master, which is a pristine fast-forward of develop and has already passed
# lint + test + deploy in ci.yml. Re-running those gates here would duplicate
# the same verification on the same tree, so this workflow only builds,
# publishes and deploys, pointed at a production cluster through the
# <CI_ENV>_* repo variables.
name: Tag Build
on:
  push:
    tags: ['*']

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  call-build-deploy:
    uses: dictyBase/workflows/.github/workflows/composite-deploy.yaml@develop
    secrets: inherit
    with:
      app: content
      project: modware-content
      stack: dcr-kube1
      repository: ${{ github.repository }}
      ref: ${{ github.ref_name }}
      dockerfile: build/package/Dockerfile
      docker_image: modware-content
      cluster: ${{ vars.PROD_CLUSTER }}
      cluster_state_storage: ${{ vars.PROD_KOPS_STATE_STORAGE }}
      kops_version: ${{ vars.PROD_KOPS_VERSION }}
      kubectl_version: ${{ vars.PROD_KUBECTL_VERSION }}
      pulumi_version: ${{ vars.PROD_PULUMI_VERSION }}
      environment: production
      runner: backend
